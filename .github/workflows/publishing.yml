name: Publishing policy tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Run all Node regression suites under the committed lockfile.
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/*.test.mjs
