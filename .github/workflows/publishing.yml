name: Regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # policy tests are pure node, but run them under the committed lockfile too
      - run: npm ci --no-audit --no-fund
      # every suite, not just publishing: auth, workspace, review flow, media, cache
      - run: node --test tests/*.mjs
